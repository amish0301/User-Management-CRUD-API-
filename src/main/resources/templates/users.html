<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Management System</h1>
        
        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" th:text="${totalUsers}">0</div>
                <div>Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${avgAge}">0</div>
                <div>Average Age</div>
            </div>
        </div>
        
        <!-- Users Table (only show if users exist) -->
        <div th:if="${totalUsers > 0}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.name}">Name</td>
                        <td th:text="${user.email}">Email</td>
                        <td th:text="${user.age}">Age</td>
                        <td th:text="${user.createdAt}">Date</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Empty State (only show if no users) -->
        <div class="empty" th:if="${totalUsers == 0}">
            <h2>No Users Found</h2>
            <p>Create users using the REST API</p>
            <a href="/api/v1/users" class="btn">View API</a>
        </div>
        
        <!-- Links -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee;">
            <a href="/api/v1/users" class="btn">JSON API</a>
            <a href="/h2-console" class="btn">Database Console</a>
        </div>
    </div>
</body>
</html>
